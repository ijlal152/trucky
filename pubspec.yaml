name: trucky
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  bloc: ^9.2.1

  # Local Database
  get_storage: ^2.1.1

  # Network
  dio: ^5.7.0
  connectivity_plus: ^7.0.0

  # Utilities
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.3.1
  image_picker: ^1.1.2
  device_region: ^1.4.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  geolocator_android: ^5.0.2
  url_launcher: ^6.3.2
  flutter_svg: ^2.0.17
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  share_plus: ^12.0.2
  flutter_barcode_scanner_plus: ^3.0.8
  uuid: ^4.5.1
  fl_chart: ^1.2.0
  flutter_blue_plus: ^2.3.11
  get_it: ^9.2.1

  # Localization
  intl: ^0.20.2

  # Code Generation
  equatable: ^2.0.5

  # Others
  cupertino_icons: ^1.0.6
  path: ^1.9.0
  logger: ^2.0.2
  dartz: ^0.10.1
  injectable: ^3.0.0
  workmanager: ^0.9.0+3
  internet_connection_checker_plus: ^3.1.1
  device_info_plus: ^12.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    - assets/svgs/
    - assets/country_codes_currency.json

  fonts:
    - family: Gilroy-Regular
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf

    - family: Gilroy-Bold
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf

    - family: Inter-Regular
      fonts:
        - asset: assets/fonts/Inter-Regular.otf

    - family: Inter-Bold
      fonts:
        - asset: assets/fonts/Inter-Bold.otf

    - family: Inter-SemiBold
      fonts:
        - asset: assets/fonts/Inter-SemiBold.otf

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto_regular.ttf
